  const state = { persistent: null, activeVersion: context.guideVersion, pages: new Map(), index: [], pending: false,

    drafts: new Map(), uncertainTargets: new Set(), activeReplyRootId: null, activeReplyScope: null, replyUnavailable: false, activeTarget: null, opener: null, posting: false, threadLocked: false };
  // Reactions have their own state and requests; they never rebuild the composer.
  const reactionProtocol = runtime.transport.reactionVersion === 2 ? { reactionVersion: 2 } : {};
  const reactionTypes = ['like', 'heart', 'smile', 'celebrate', 'thinking', ...(reactionProtocol.reactionVersion === 2 ? ['sad'] : [])];
  const reactionEmoji = { like: '👍', heart: '❤️', smile: '😄', celebrate: '🎉', thinking: '🤔', sad: '😢' };
  const reactionReadEnabled = typeof runtime.transport.readReactions === 'function';
  const reactionWriteEnabled = typeof runtime.transport.setReaction === 'function' &&

  const reactionState = { rows: new Map(), panels: new Map(), generation: 0, open: null, visitorId: null };
  const visitorStorageKey = 'carambi:demons-within:reaction-visitor:v1';
  function reactionVisitor() {
    try {
      let value = localStorage.getItem(visitorStorageKey);
      if (!/^[0-9a-f]{64}$/.test(value ?? '')) {
        const bytes = new Uint8Array(32); crypto.getRandomValues(bytes);
        value = [...bytes].map(byte => byte.toString(16).padStart(2, '0')).join('');
        localStorage.setItem(visitorStorageKey, value);
        if (localStorage.getItem(visitorStorageKey) !== value) return null;
      }
      return value;
    } catch { return null; }
  }
  function reactionRow(id) {
    if (!reactionState.rows.has(id)) reactionState.rows.set(id, { data: null, ready: false, pending: false,

    return reactionState.rows.get(id);
  }

      value.selected.every(type => reactionTypes.includes(type) && value.counts[type] > 0);

  // Position the chooser over the page without consuming toolbar or tree height.

  function paintReactions(id) {

        ['ArrowLeft', 'ArrowUp'].includes(event.key) ? (at + buttons.length - 1) % buttons.length : null;

  async function readReactions(ids, generation, preserveMessage = false) {
    if (!reactionReadEnabled || !ids.length) return;
    const visitorId = reactionVisitor(); reactionState.visitorId = visitorId;
    for (let offset = 0; offset < ids.length; offset += 50) {
      if (generation !== reactionState.generation) return;
      const batch = ids.slice(offset, offset + 50);
      const tokens = new Map(batch.map(id => { const row = reactionRow(id); return [id, { token: ++row.readToken, revision: row.revision }]; }));
      try {
        const response = await runtime.transport.readReactions({ ...reactionProtocol, pageKey: context.pageKey, locale: context.locale,
          commentIds: batch, ...(visitorId ? { visitorId } : {}) });
        if (response?.ok !== true || !Array.isArray(response.reactions) || response.reactions.length !== batch.length ||
            new Set(response.reactions.map(row => row?.commentId)).size !== batch.length ||
            !response.reactions.every(row => batch.includes(row?.commentId) && validReaction(row, row.commentId)))
          throw Error('INVALID_REACTION_RESPONSE');
        if (generation !== reactionState.generation) return;
        for (const data of response.reactions) {
          const row = reactionRow(data.commentId), token = tokens.get(data.commentId);
          if (row.pending || row.readToken !== token.token || row.revision !== token.revision) continue;
          row.data = data; row.visitorId = visitorId; row.ready = true; row.retry = false;
          if (!preserveMessage) row.message = '';
          paintReactions(data.commentId);
        }
      } catch (error) {
        if (generation !== reactionState.generation) return;
        for (const id of batch) {
          const row = reactionRow(id), token = tokens.get(id);
          if (row.pending || row.readToken !== token.token || row.revision !== token.revision) continue;
          row.ready = false; row.retry = true;
          const failure = error?.httpStatus === 429 || error?.code === 'RATE_LIMITED' ? reactionWords.rate : reactionWords.failed;
          row.message = preserveMessage && row.message ? row.message + ' ' + failure : failure;
          paintReactions(id);
        }
      }
    }
  }
  async function writeReaction(id, type) {
    const row = reactionRow(id);
    if (!row.ready || row.pending || row.data?.canReact !== true || !reactionWriteEnabled) return;

      script.onerror = () => { clearTimeout(timeout); script.remove(); reject(Error('TURNSTILE_UNAVAILABLE')); };
      document.head.append(script);
    }).catch(error => { turnstileScript = null; throw error; });
    return turnstileScript;
  }
  async function renderChallenge(messageText = words.verifyWait) {
    clearWidget();
    if (!state.activeTarget || !writeEnabled || state.uncertainTargets.has(state.activeTarget) ||
        (state.activeTarget.startsWith('reply:') && !canReplyTo(findReplyContext(state.activeTarget.slice(6))))) return;

    verifyRetry.hidden = true;

      const turnstile = await ensureTurnstile();
      if (generation !== widgetGeneration || !state.activeTarget) return;
      widgetId = turnstile.render(verifySlot, {
        sitekey: runtime.transport.turnstileSitekey, action: 'discussion_post',
        theme: 'auto', size: matchMedia('(max-width: 370px)').matches ? 'compact' : 'flexible',
        'response-field': false,
        callback(value) {

          token = value; updateSubmit(); verifyRetry.hidden = true;
          if (formStatus.textContent === words.verifyWait || formStatus.textContent === words.verifyLoad)
            formStatus.textContent = '';
        },
        'error-callback'() {
          if (generation !== widgetGeneration) return true;
          token = null; updateSubmit(); formStatus.textContent = words.verifyLoad;
          verifyRetry.hidden = false; return true;
        },
        'expired-callback'() {
          if (generation === widgetGeneration) renderChallenge(words.verifyWait);
        },
        'timeout-callback'() {
          if (generation === widgetGeneration) renderChallenge(words.verifyWait);
        },
      });
    } catch {
      if (generation !== widgetGeneration) return;
      token = null; updateSubmit(); formStatus.textContent = words.verifyLoad;
      verifyRetry.hidden = false;
    }
  }
  function closeComposer(restoreFocus = true) {
    if (!state.activeTarget) return;
    saveDraft();
    const opener = state.opener;
    state.activeTarget = null; state.opener = null; state.activeReplyRootId = null; state.activeReplyScope = null; state.replyUnavailable = false;
    clearWidget();
    composerHost.hidden = true; replyTargetNotice.textContent = ''; replyTargetNotice.hidden = true;
    comments.before(composerHost);
    if (restoreFocus && opener?.isConnected && !opener.hidden) opener.focus({ preventScroll: true });
  }
  function placeComposer() {
    if (!state.activeTarget) return;
    if (state.activeTarget === 'root') {
      if (rootAction.hidden) { closeComposer(false); return; }
      replyTargetNotice.hidden = true; replyTargetNotice.textContent = '';
      rootAction.after(composerHost);
    } else {
      const targetId = state.activeTarget.slice(6);
      const item = findReplyContext(targetId);
      const target = document.getElementById(`dw-comment-${targetId}`);
      const action = target?.querySelector(':scope > .dw-discussion-actions > .dw-discussion-reply-action');
      if (!canReplyTo(item) || !action) {
        saveDraft(); state.replyUnavailable = true; clearWidget(); verifyRetry.hidden = true;
        replyTargetNotice.textContent = item?.target.status === 'hidden' ? words.replyingHidden : item?.target.status === 'deleted' ? words.replyingDeleted : words.replyingMissing;
        replyTargetNotice.hidden = false; replyTargetNotice.dataset.replyToCommentId = targetId;
        replyTargetNotice.dataset.rootCommentId = state.activeReplyRootId || '';
        formStatus.textContent = state.threadLocked ? words.postLocked : words.targetUnavailable;
        comments.before(composerHost); composerHost.hidden = false;
        return;
      }
      state.activeReplyRootId = item.root.id; state.activeReplyScope = item.scope;
      if (state.replyUnavailable) {
        state.replyUnavailable = false;
        if (state.uncertainTargets.has(state.activeTarget)) formStatus.textContent = words.postUnknown;
        else renderChallenge();
      }
      replyTargetNotice.textContent = words.replyingTo(item.target.displayName || words.guest);
      replyTargetNotice.hidden = false;
      replyTargetNotice.dataset.replyToCommentId = item.target.id;
      replyTargetNotice.dataset.rootCommentId = item.root.id;
      state.opener = action;
      action.parentElement.after(composerHost);
    }
    composerHost.hidden = false;
  }
  function openComposer(target, opener) {
    if (!writeEnabled || state.threadLocked || state.pending || state.posting ||
        (target.startsWith('reply:') && !canReplyTo(findReplyContext(target.slice(6))))) return;
    if (state.activeTarget === target) { nameInput.focus(); return; }
    if (state.activeTarget) closeComposer(false);
    state.activeTarget = target; state.opener = opener; state.replyUnavailable = false;
    const replyContext = target.startsWith('reply:') ? findReplyContext(target.slice(6)) : null;
    state.activeReplyRootId = replyContext?.root.id ?? null; state.activeReplyScope = replyContext?.scope ?? null;
    const draft = state.drafts.get(target);
    nameInput.value = draft?.name ?? ''; bodyInput.value = draft?.body ?? '';
    subscriptionOptin.checked = draft?.subscriptionOptin === true;
    subscriptionEmail.value = draft?.subscriptionEmail ?? ''; draftSubscriptionProof = draft?.subscriptionProof ?? null;
    subscriptionEmailGroup.hidden = !subscriptionOptin.checked;
    honeypot.value = '';
    clearFieldErrors(); postNotice.textContent = '';
    submit.textContent = target === 'root' ? words.rootSubmit : words.replySubmit;
    placeComposer();
    nameInput.focus({ preventScroll: true });
    confirmUnpublished.hidden = !state.uncertainTargets.has(target);
    if (!confirmUnpublished.hidden) { clearWidget(); verifyRetry.hidden = true; formStatus.textContent = words.postUnknown; }
    else renderChallenge();
  }
  function validateDraft(target) {
    clearFieldErrors();
    const name = nameInput.value.trim();
    const body = bodyInput.value.trim();
    let valid = true;
    if (points(name) > 40) { fieldError(nameInput, nameError, words.nameLong); valid = false; }
    if (!body) { fieldError(bodyInput, bodyError, words.emptyBody); valid = false; }
    else if (points(body) > 2000) { fieldError(bodyInput, bodyError, words.bodyLong); valid = false; }
    const hash = target === 'root' ? runtime.getContentHash() : '';

  }
  async function refreshDiscussion() {
    saveDraft();
    const guideVersion = state.activeVersion;
    const loadedVersionRoots = state.pages.get(guideVersion)?.comments.length ?? 0;
    const loadedPersistentRoots = state.persistent?.comments.length ?? 0;
    const activeReply = state.activeTarget?.startsWith('reply:') ? findReplyContext(state.activeTarget.slice(6)) : null;
    const activeReplyRootId = activeReply?.root.id ?? state.activeReplyRootId;
    const replySection = activeReply?.scope ?? state.activeReplyScope;
    const response = await read(guideVersion, null);
    const makePage = (data, status) => {
      if (!Array.isArray(data?.comments)) throw Error('INVALID_DISCUSSION_RESPONSE');
      const roots = [...data.comments];
      return { status, comments: roots, seen: new Set(roots.map(root => root.id)), nextCursor: data.nextCursor };
    };
    const page = makePage(response.currentVersion, response.thread.status);
    const persistentPage = makePage(response.persistent ?? { comments: [], nextCursor: null });
    for (const [selected, selectedPage, expected] of [['current', page, loadedVersionRoots], ['persistent', persistentPage, loadedPersistentRoots]]) {
      const cursors = new Set();
      while (selectedPage.nextCursor && (selectedPage.comments.length < expected ||
          (activeReplyRootId && selected === replySection && !selectedPage.seen.has(activeReplyRootId)))) {
        if (cursors.has(selectedPage.nextCursor)) throw Error('REPEATED_DISCUSSION_CURSOR');
        cursors.add(selectedPage.nextCursor);
        const next = await read(selected === 'persistent' ? context.guideVersion : guideVersion, selectedPage.nextCursor, selected);
        const data = selected === 'persistent' ? next.persistent : next.currentVersion;
        if (!Array.isArray(data?.comments)) throw Error('INVALID_DISCUSSION_RESPONSE');
        for (const root of data.comments) if (!selectedPage.seen.has(root.id)) { selectedPage.comments.push(root); selectedPage.seen.add(root.id); }
        selectedPage.nextCursor = data.nextCursor;
      }
    }
    // Commit together so a failure on any later page preserves the existing view.
    state.pages.set(guideVersion, page);
    state.persistent = persistentPage;
    state.index = response.earlierVersions;
    renderPage();
  }
  async function manualRefresh() {
    if (state.pending || state.posting) return;
    const position = { x: window.scrollX, y: window.scrollY };
    const focused = document.activeElement;
    const focusedId = focused?.id;
    const selection = typeof focused?.selectionStart === 'number' ?
      { start: focused.selectionStart, end: focused.selectionEnd, direction: focused.selectionDirection } : null;
    const version = focused?.closest('.dw-discussion-version-buttons') ? state.activeVersion : null;
    busy(true); refresh.textContent = words.refreshing; message('loading');
    try { await refreshDiscussion(); message(); }
    catch {
      prepareReactions();
      status.replaceChildren(make('span', '', words.refreshError));
      const retry = make('button', 'dw-discussion-action', words.retry);
      retry.type = 'button'; retry.addEventListener('click', manualRefresh); status.append(retry);
    } finally {
      busy(false); refresh.textContent = words.refresh;
      const visible = node => node?.isConnected && !node.closest('[hidden]');
      const replacement = focusedId ? document.getElementById(focusedId) : null;
      const focusTarget = visible(focused) ? focused : visible(replacement) ? replacement :
        version ? [...versionButtons.querySelectorAll('button')].find(button => button.getAttribute('aria-pressed') === 'true') || refresh : refresh;
      focusTarget?.focus({ preventScroll: true });
      if (selection && typeof focusTarget?.setSelectionRange === 'function')
        focusTarget.setSelectionRange(selection.start, selection.end, selection.direction);
      window.scrollTo(position.x, position.y);
    }
  }
  function outcomeUnknown(error) {
    if (typeof error?.outcomeUnknown === 'boolean') return error.outcomeUnknown;
    if (error?.fieldErrors) return false;
    return !['RATE_LIMITED', 'VERIFICATION_FAILED', 'THREAD_LOCKED', 'INVALID_INPUT', 'VALIDATION_FAILED', 'INVALID_REQUEST', 'ORIGIN_DENIED', 'SITE_NOT_FOUND', 'PAGE_NOT_FOUND'].includes(error?.code);
  }
  function invalidReplyError(error) {
    return error?.code === 'VALIDATION_FAILED' &&
      (error?.fieldErrors?.replyToCommentId === 'NOT_REPLYABLE' || error?.fieldErrors?.parentCommentId === 'NOT_REPLYABLE');
  }
  function postError(error) {
    if (invalidReplyError(error)) return words.targetUnavailable;
    if (error?.code === 'RATE_LIMITED') return words.rateLimited;
    if (error?.code === 'VERIFICATION_FAILED') return words.verifyFailed;
    if (error?.code === 'THREAD_LOCKED') return words.postLocked;
    if (error?.fieldErrors?.displayName) fieldError(nameInput, nameError, words.badName);
    if (error?.fieldErrors?.body) fieldError(bodyInput, bodyError, words.emptyBody);
    return words.postFailed;
  }
  async function submitDraft(event) {
    event.preventDefault();
    const target = state.activeTarget;
    if (!target || state.pending || state.posting || state.uncertainTargets.has(target) || !validateDraft(target)) return;

    if (target !== 'root' && !canReplyTo(replyContext)) {
      saveDraft(); placeComposer(); postNotice.textContent = words.targetUnavailable; return;
    }
    if (!token) { formStatus.textContent = words.verifyWait; return; }
    const subscriptionSnapshot = { optin: subscriptionEnabled && subscriptionOptin.checked, email: subscriptionEmail.value.trim(), proof: null };
    if (subscriptionSnapshot.optin) {
      draftSubscriptionProof ||= newSubscriptionProof(); subscriptionSnapshot.proof = draftSubscriptionProof; saveDraft();
    }
    const usedToken = token;
    token = null;
    state.posting = true; updateSubmit(); cancel.disabled = true;
    subscriptionOptin.disabled = subscriptionEmail.disabled = true;
    refresh.disabled = true;
    versionButtons.querySelectorAll('button').forEach(button => { button.disabled = true; });
    rootAction.disabled = true;
    more.disabled = persistentMore.disabled = true;
    section.querySelectorAll('.dw-discussion-reply-action').forEach(button => { button.disabled = true; });
    formStatus.textContent = words.posting;
    const payload = {
      pageKey: context.pageKey, locale: context.locale, guideVersion: context.guideVersion,
      displayName: nameInput.value, body: bodyInput.value,
      pageHash: target === 'root' ? runtime.getContentHash() : '',

      state.activeTarget = null; state.opener = null; state.activeReplyRootId = null; state.activeReplyScope = null; state.replyUnavailable = false;
      clearWidget(); composerHost.hidden = true; comments.before(composerHost);
      postNotice.textContent = target === 'root' ? words.rootSuccess : words.replySuccess;
      postNotice.dataset.state = 'success';
      subscriptionOptin.checked = false; subscriptionEmail.value = ''; draftSubscriptionProof = null; subscriptionEmailGroup.hidden = true;
      // Private failures are contained in runSubscription; they never enter the comment catch.
      beginSubscription(posted, subscriptionSnapshot);

        await refreshDiscussion();
        const rendered = posted.commentId && document.getElementById(`dw-comment-${posted.commentId}`);
        if (!subscriptionPanel.contains(document.activeElement)) (rendered || postNotice).focus({ preventScroll: true });
      } catch {
        postNotice.textContent = words.refreshFailed;
        if (!subscriptionPanel.contains(document.activeElement)) postNotice.focus({ preventScroll: true });
      }
    } catch (error) {
      saveDraft();

      if (outcomeUnknown(error)) {

        confirmUnpublished.hidden = false; formStatus.textContent = words.postUnknown;
      } else if (invalidReplyError(error) && replyContext) {
        if (error.fieldErrors?.parentCommentId === 'NOT_REPLYABLE') replyContext.root.canReply = false;
        else replyContext.target.canReply = false;

        try { await refreshDiscussion(); } catch { renderPage(); }

        state.threadLocked = true;

        try { await refreshDiscussion(); } catch { renderPage(); }
      } else {
        state.posting = false;
        renderChallenge(messageText);
      }
    } finally {
      state.posting = false; cancel.disabled = false;
      subscriptionOptin.disabled = subscriptionEmail.disabled = false;
      updateSubmit();
      refresh.disabled = state.pending;
      versionButtons.querySelectorAll('button').forEach(button => { button.disabled = state.pending; });
      rootAction.disabled = state.pending;
      more.disabled = persistentMore.disabled = state.pending;
      section.querySelectorAll('.dw-discussion-reply-action').forEach(button => { button.disabled = state.pending; });
      scheduleLocationReplay();
    }
  }
  if (writeEnabled) {
    rootAction.addEventListener('click', () => openComposer('root', rootAction));
    cancel.addEventListener('click', () => closeComposer());
    verifyRetry.addEventListener('click', () => renderChallenge());
    confirmUnpublished.addEventListener('click', () => {
      if (state.posting || state.pending || !state.activeTarget ||
          (state.activeTarget.startsWith('reply:') && !canReplyTo(findReplyContext(state.activeTarget.slice(6))))) return;
      state.uncertainTargets.delete(state.activeTarget); confirmUnpublished.hidden = true; renderChallenge();
    });
    subscriptionOptin.addEventListener('change', () => {
      subscriptionEmailGroup.hidden = !subscriptionOptin.checked;
      if (!subscriptionOptin.checked) draftSubscriptionProof = null;
      saveDraft();
    });
    subscriptionEmail.addEventListener('input', saveDraft);
    nameInput.addEventListener('input', saveDraft);
    bodyInput.addEventListener('input', saveDraft);
    form.addEventListener('submit', submitDraft);
  }
  async function loadVersion(guideVersion) {
    if (state.pending || state.posting) return;
    const cached = state.pages.get(guideVersion);
    if (cached) {
      state.activeVersion = guideVersion;
      saveDraft(); message(); renderPage();
      return;
    }
    busy(true); message('loading');
    try {
      const response = await read(guideVersion, null);
      saveDraft(); rememberPersistent(response);
      const roots = response.currentVersion.comments;
      state.pages.set(guideVersion, {
        status: response.thread.status, comments: roots, seen: new Set(roots.map(root => root.id)),
        nextCursor: response.currentVersion.nextCursor,
      });
      if (guideVersion === context.guideVersion && !state.index.length)
        state.index = response.earlierVersions;
      state.activeVersion = guideVersion;
      message();
    } catch {
      message('error', () => loadVersion(guideVersion));
    } finally {
      busy(false); renderPage();
    }
  }
  async function loadMore() {
    const page = state.pages.get(state.activeVersion);
    if (state.pending || state.posting || !page?.nextCursor) return;
    saveDraft();
    const guideVersion = state.activeVersion;
    const cursor = page.nextCursor;
    busy(true); message('loading');
    try {
      const response = await read(guideVersion, cursor);
      for (const root of response.currentVersion.comments) {
        if (!page.seen.has(root.id)) { page.comments.push(root); page.seen.add(root.id); }
      }
      page.nextCursor = response.currentVersion.nextCursor;
      message();
    } catch {
      message('error', loadMore);
    } finally {
      busy(false); renderPage();
    }
  }
  function rememberPersistent(response, reset = false) {
    if (state.persistent && !reset) return;

    if (!Array.isArray(page.comments)) throw Error('INVALID_DISCUSSION_RESPONSE');
    state.persistent = { comments: page.comments, seen: new Set(page.comments.map(root => root.id)), nextCursor: page.nextCursor };
  }
  async function loadPersistent() {
    const page = state.persistent;
    if (state.pending || state.posting || !page?.nextCursor) return;
    saveDraft(); busy(true); message('loading');
    try {
      const response = await read(context.guideVersion, page.nextCursor, 'persistent');
      if (!Array.isArray(response.persistent?.comments)) throw Error('INVALID_DISCUSSION_RESPONSE');
      for (const root of response.persistent.comments) if (!page.seen.has(root.id)) { page.comments.push(root); page.seen.add(root.id); }

  }
  refresh.addEventListener('click', manualRefresh);
  persistentMore.addEventListener('click', loadPersistent);
  let locationGeneration = 0;
  async function locateComment() {
    const run = ++locationGeneration;
    const id = location.hash.slice(1);
    if (!new RegExp('^dw-comment-[0-9a-f]{8}-[0-9a-f-]{27}$', 'i').test(id)) return;
    const visited = new Set();
    while (run === locationGeneration) {
      const target = document.getElementById(id);
      if (target) { target.focus({ preventScroll: true }); target.scrollIntoView({ block: 'center', behavior: 'instant' }); return; }
      const persistentTarget = new URLSearchParams(location.search).get('discussionScope') === 'persistent';
      const page = persistentTarget ? state.persistent : state.pages.get(state.activeVersion);
      if (!page?.nextCursor || visited.has(page.nextCursor)) break;
      visited.add(page.nextCursor);
      if (persistentTarget) await loadPersistent(); else await loadMore();
      if (state.pending || state.posting) return;

    if (run === locationGeneration) postNotice.textContent = words.missing;
  }
  function scheduleLocationReplay() {
    if (!state.locationQueued || state.pending || state.posting || state.navigationRunning || state.locationReplayScheduled) return;
    state.locationReplayScheduled = true;
    queueMicrotask(() => {
      state.locationReplayScheduled = false;
      if (!state.locationQueued || state.pending || state.posting || state.navigationRunning) return;
      state.locationQueued = false;
      followLocation();
    });
  }
  async function followLocation() {
    if (state.pending || state.posting || state.navigationRunning) {
      state.locationQueued = true;
      locationGeneration++;
      return;
    }
    state.navigationRunning = true;
    try {
      const params = new URLSearchParams(location.search); const version = params.get('discussionVersion')?.trim();
      await loadVersion(params.get('discussionScope') !== 'persistent' && version && Array.from(version).length <= 80 ? version : context.guideVersion);
      if (!state.locationQueued && !state.pending && !state.posting) await locateComment();

  state.navigationRunning = true;
  loadVersion(context.guideVersion).finally(() => {
    state.navigationRunning = false;
    if (state.pages.has(context.guideVersion)) state.locationQueued = true;
    scheduleLocationReplay();
  });
})();
