<!-- Shared page context and transport boundary for Discussion and Feedback. -->
<script>
(() => {
  'use strict';
  if (window.__dwDiscussionRuntime) return;

  const guideVersion = 'Public 14.6';
  const pageKeys = Object.freeze({
    '/guide/choices.html': 'guide.choices',
    '/guide/faq.html': 'guide.faq',
    '/reference/interventions.html': 'reference.interventions',
    '/collectibles/cg.html': 'collectibles.cg',
    '/collectibles/memorium.html': 'collectibles.memorium',
    '/en/guide/choices.html': 'guide.choices',
    '/en/guide/faq.html': 'guide.faq',
    '/en/reference/interventions.html': 'reference.interventions',
    '/en/collectibles/cg.html': 'collectibles.cg',
    '/en/collectibles/memorium.html': 'collectibles.memorium',
  });

  // Accept only existing guide body anchors, never discussion or publication UI IDs.
  function getContentHash(hash = location.hash) {
    if (!/^#[^?#]{1,255}$/.test(hash) || Array.from(hash).length > 256) return '';
    let id;
    try { id = decodeURIComponent(hash.slice(1)); } catch { return ''; }
    if (/^(?:[a-z]+-comment-|[0-9a-f]{8}-[0-9a-f-]{27}$)/i.test(id)) return '';
    const target = document.getElementById(id);
    const main = document.querySelector('main#quarto-document-content');
    if (!target || target === main || !main?.contains(target) ||
        target.closest('header, nav, footer, aside, form, dialog, [role="dialog"], .quarto-title-block, .quarto-title, .toc, .footnotes, [role="doc-endnotes"], [role="navigation"], #dw-public-discussion, #dw-discussion-hub') ||
        !target.matches('section[id], h2[id], h3[id], h4[id], h5[id], h6[id], p[id], li[id], blockquote[id], table[id], figure[id]')) return '';
    return hash;
  }

  function getContext() {
    const locale = document.documentElement.lang;
    if (locale !== 'en' && locale !== 'zh-CN') return null;
    const pagePath = location.pathname;
    if ((locale === 'en') !== pagePath.startsWith('/en/')) return null;
    return Object.freeze({
      site: 'demons-within',
      locale,
      pageKey: Object.hasOwn(pageKeys, pagePath) ? pageKeys[pagePath] : null,
      guideVersion,
      pagePath,
      pageHash: location.hash,
      viewportClass: matchMedia('(min-width: 768px)').matches ? 'desktop' : 'mobile',
    });
  }

  const localHost = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
  const stagingHost = location.hostname === 'dw-staging.carambi.com';
  const productionHost = location.hostname === 'demons-within.carambi.com';
  const transport = localHost ? window.__dwDiscussionFixtureTransport ?? null :
    (stagingHost || productionHost) ? window.__dwDiscussionRemoteTransport ?? null : null;
  window.__dwDiscussionRuntime = Object.freeze({
    getContext, getContentHash, transport, mode: transport ?
      (localHost ? 'fixture' : stagingHost ? 'staging-read' : 'production') : 'inactive',
  });
  const context = getContext();
  if (!context?.pageKey) return;
  const main = document.querySelector('#quarto-content > main#quarto-document-content');
  if (!main || document.getElementById('dw-public-discussion')) return;
  const mount = document.createElement('div');
  mount.id = 'dw-public-discussion';
  mount.hidden = true;
  mount.setAttribute('data-dw-discussion-mount', '');
  mount.dataset.pageKey = context.pageKey;
  main.after(mount);
})();
</script>
