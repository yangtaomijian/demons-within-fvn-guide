<script>
(() => {
  const english = document.documentElement.lang === 'en';
  const link = [...document.querySelectorAll('.navbar a')].find(a => a.textContent.trim() === (english ? '中文' : 'EN'));
  const brand = document.querySelector('.navbar-brand');
  if (!link || !brand) return;
  const languageRoot = new URL('./', brand.href);
  const root = new URL(english ? '../' : './', languageRoot);
  const pages = new Set(['', 'index.html', 'guide/faq.html', 'guide/choices.html', 'reference/interventions.html', 'collectibles/cg.html', 'collectibles/memorium.html']);
  function update() {
    const page = location.pathname.slice(languageRoot.pathname.length);
    if (!location.pathname.startsWith(languageRoot.pathname) || !pages.has(page)) return;
    const target = new URL((english ? '' : 'en/') + (page || 'index.html'), root);
    target.search = location.search;
    target.hash = location.hash;
    link.href = target.href;
  }
  update();
  window.addEventListener('hashchange', update);
  link.addEventListener('pointerdown', update);
  link.addEventListener('click', update);
  link.addEventListener('focus', update);
})();
</script>
