project:
  type: website
  output-dir: _site
  resources:
    - 404.html
    - googlef0776754787f4a8e.html
    - assets/favicon.svg
    - assets/favicon-32x32.png
    - assets/apple-touch-icon.png
    - assets/dw-search-core.js
    - assets/fonts/Newsreader-OFL.txt
  post-render:
    - python3 scripts/build-safe-search.py
  render:
    - index.md
    - guide/choices.qmd
    - guide/faq.md
    - reference/interventions.md
    - collectibles/cg.md
    - collectibles/memorium.md

lang: zh

website:
  favicon: assets/favicon.svg
  site-url: "https://demons-within.carambi.com/"
  open-graph:
    locale: zh_CN
    site-name: "Demons Within 玩家攻略"
  twitter-card:
    card-style: summary
  page-footer:
    center: |
      <div class="dw-publication-footer"><p>非官方玩家攻略，适用于 Demons Within Public 14.6；后续版本可能不同。</p><div class="dw-publication-footer-links"><span>由 <a class="dw-carambi-link" href="https://carambi.com/">Carambi</a> 维护</span><button class="dw-feedback-slot" type="button" disabled title="反馈入口将在后续版本开放">反馈 · 即将开放</button><a class="dw-back-to-top" href="#">↑ 返回顶部</a></div></div>
  title: "Demons Within 玩家攻略"
  description: "《心魔在焉（Demons Within）》Public 14.6 非官方中文玩家攻略，涵盖主线选择、结局、CG 与辞书收集。"
  search:
    location: navbar
    type: overlay
  comments:
    giscus:
      repo: yangtaomijian/demons-within-fvn-guide
      repo-id: R_kgDOUinN_Q
      category: Guide Feedback
      category-id: DIC_kwDOUinN_c4DGBwW
      mapping: pathname
      reactions-enabled: true
      input-position: top
      loading: lazy
      theme:
        light: light
        dark: dark_dimmed
      language: zh-CN
  sidebar:
    style: docked
    collapse-level: 1
    search: false
    contents:
      - section: "首页"
        contents:
          - href: index.md
            text: "首页"
      - section: "攻略"
        contents:
          - href: guide/choices.qmd
            text: "关键选择"
          - href: reference/interventions.md
            text: "全选项"
          - href: guide/faq.md
            text: "常见问题"
      - section: "收集"
        contents:
          - href: collectibles/cg.md
            text: "CG"
          - href: collectibles/memorium.md
            text: "辞书与立绘"
  navbar:
    right:
      - href: en/index.html
        text: EN
    left:
      - href: index.md
        text: 首页
      - text: 攻略
        menu:
          - href: guide/choices.qmd
            text: 关键选择
          - href: reference/interventions.md
            text: 全选项
          - href: guide/faq.md
            text: 常见问题
      - text: 收集
        menu:
          - href: collectibles/cg.md
            text: CG
          - href: collectibles/memorium.md
            text: 辞书与立绘

format:
  html:
    canonical-url: true
    include-in-header: assets/google-site-verification.html
    variables:
      lang: zh-CN
    theme:
      light: [cosmo, assets/system-fonts.scss]
      dark: [cosmo, assets/system-fonts.scss, assets/dw-dark.scss]
    respect-user-color-scheme: true
    css:
      - assets/dw-theme.css
      - assets/styles.css
      - assets/dw-layout.css
      - assets/dw-publication-v2a.css
      - assets/dw-reference-v2b.css
    include-after-body:
      - assets/language-switch.html
      - assets/dw-layout-controls.html
      - assets/dw-publication-v2a.html
      - assets/dw-reference-v2b.html
      - assets/cloudflare-web-analytics.html
      - assets/dw-search.html
    smooth-scroll: false
