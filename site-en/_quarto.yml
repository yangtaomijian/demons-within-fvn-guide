project:
  type: website
  output-dir: _site
  resources:
    - Newsreader-OFL.txt
  post-render:
    - python3 scripts/build-safe-search.py
  render:
    - index.md
    - guide/choices.qmd
    - guide/faq.md
    - reference/interventions.md
    - collectibles/cg.md
    - collectibles/memorium.md
lang: en

website:
  favicon: assets/favicon.svg
  site-url: "https://demons-within.carambi.com/en/"
  open-graph:
    locale: en_US
    site-name: "Demons Within Player Guide"
  twitter-card:
    card-style: summary
  page-footer:
    center: |
      <div class="dw-publication-footer"><p>Unofficial fan-made guide for Demons Within Public 14.6; later releases may differ.</p><div class="dw-publication-footer-links"><span>Maintained by <a class="dw-carambi-link" href="https://carambi.com/">Carambi</a></span><button class="dw-feedback-slot" type="button" disabled title="Private feedback requires JavaScript and the feedback form to load">Private feedback</button><a class="dw-back-to-top" href="#">↑ Back to top</a></div></div>
  title: "Demons Within Player Guide"
  description: "An unofficial Public 14.6 player guide for Demons Within, covering story choices, endings, CGs, and Memory Codex unlocks."
  search:
    location: navbar
    type: overlay
  sidebar:
    style: docked
    collapse-level: 1
    search: false
    contents:
      - href: index.md
        text: "Home"
      - section: "Guide"
        contents:
          - href: guide/choices.qmd
            text: "Key Choices"
          - href: reference/interventions.md
            text: "Full Choice Index"
          - href: guide/faq.md
            text: "FAQ"
      - section: "Collections"
        contents:
          - href: collectibles/cg.md
            text: "CG Scenes"
          - href: collectibles/memorium.md
            text: "Memory Codex & Sprite Viewer"
  navbar:
    right:
      - href: ../index.html
        text: 中文
    left:
      - href: index.md
        text: Home
      - text: Guide
        menu:
          - href: guide/choices.qmd
            text: Key Choices
          - href: reference/interventions.md
            text: Full Choice Index
          - href: guide/faq.md
            text: FAQ
      - text: Collections
        menu:
          - href: collectibles/cg.md
            text: CG Scenes
          - href: collectibles/memorium.md
            text: Memory Codex & Sprite Viewer
format:
  html:
    canonical-url: true
    include-in-header:
      - ../assets/google-site-verification.html
      - ../assets/dw-discussion-config.html
    theme:
      light: [cosmo, assets/system-fonts.scss]
      dark: [cosmo, assets/system-fonts.scss, assets/dw-dark.scss]
    respect-user-color-scheme: true
    css:
      - assets/dw-theme.css
      - assets/styles.css
      - assets/dw-layout.css
      - assets/dw-publication-v2a.css
      - assets/dw-reference-v2b.css
      - assets/dw-discussion.css
      - assets/dw-feedback.css
    include-after-body:
      - assets/language-switch.html
      - assets/dw-layout-controls.html
      - assets/dw-publication-v2a.html
      - assets/dw-reference-v2b.html
      - assets/cloudflare-web-analytics.html
      - ../assets/dw-search.html
      - ../assets/dw-discussion-fixtures.html
      - ../assets/dw-discussion-remote.html
      - ../assets/dw-discussion-runtime.html
      - ../assets/dw-discussion-ui.html
      - ../assets/dw-feedback-ui.html
    smooth-scroll: false
