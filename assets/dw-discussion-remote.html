<!-- Host-selected remote transport for staging and production. -->
<script>
(() => {
  'use strict';
  const environment = location.hostname === 'dw-staging.carambi.com' ? 'staging' :
    location.hostname === 'demons-within.carambi.com' ? 'production' : null;
  if (!environment) return;
  const meta = name => document.querySelector(`meta[name="${name}"]`)?.content ?? '';
  if (meta('dw-discussion-environment') !== environment) return;
  const origin = meta('dw-discussion-api');
  const turnstileSitekey = meta('dw-discussion-turnstile-sitekey');
  const expectedApiHost = `discussion${environment === 'staging' ? '-staging' : ''}.carambi.com`;
  if (origin !== `https://${expectedApiHost}` || !/^0x[A-Za-z0-9]+$/.test(turnstileSitekey)) return;
  const config = Object.freeze({ origin, turnstileSitekey });
  const endpoint = config.origin + '/v1/discussion';
  const reactionTypes = ['like', 'heart', 'smile', 'celebrate', 'thinking'];
  const uuid = value => typeof value === 'string' && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(value);
  function validReaction(value, id) {
    return value?.commentId === id && typeof value.canReact === 'boolean' &&
      value.counts && Object.keys(value.counts).length === reactionTypes.length &&
      reactionTypes.every(type => Number.isSafeInteger(value.counts[type]) && value.counts[type] >= 0) &&
      Array.isArray(value.selected) && new Set(value.selected).size === value.selected.length &&
      value.selected.every(type => reactionTypes.includes(type) && value.counts[type] > 0);
  }
  async function reactionRequest(path, payload, writing = false) {
    const controller = new AbortController();
    let response, timer, data;
    try {
      await Promise.race([
        (async () => {
          response = await fetch(endpoint + path, {
            method: 'POST', mode: 'cors', credentials: 'omit', referrerPolicy: 'no-referrer',
            headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload), signal: controller.signal,
          });
          try { data = await response.json(); } catch { /* Invalid responses never confirm a write. */ }
        })(),
        new Promise((_, reject) => { timer = setTimeout(() => {
          controller.abort(); reject(Error('REACTION_REQUEST_TIMEOUT'));
        }, 15000); }),
      ]);
    } catch {
      const error = Error('REACTION_NETWORK_FAILED');
      error.outcomeUnknown = writing && (!response || ![400, 401, 403, 404, 405, 409, 413, 415, 422, 423, 429].includes(response.status));
      throw error;
    } finally { clearTimeout(timer); }
    if (response.status !== 200 || data?.ok !== true) {
      const error = Error('REACTION_REQUEST_FAILED');
      error.httpStatus = response.status;
      error.code = typeof data?.code === 'string' ? data.code : null;
      error.outcomeUnknown = writing && ![400, 401, 403, 404, 405, 409, 413, 415, 422, 423, 429].includes(response.status);
      throw error;
    }
    return data;
  }
  function reactionContext(input) {
    if (typeof input.pageKey !== 'string' || !input.pageKey || !['zh-CN', 'en'].includes(input.locale))
      throw Error('INVALID_REACTION_REQUEST');
    if (input.visitorId !== undefined && !/^[0-9a-f]{64}$/.test(input.visitorId)) throw Error('INVALID_REACTION_REQUEST');
    return { pageKey: input.pageKey, locale: input.locale };
  }
  window.__dwDiscussionRemoteTransport = Object.freeze({
    turnstileSitekey: config.turnstileSitekey,
    async readDiscussion(request) {
      const url = new URL(endpoint);
      for (const key of ['pageKey', 'locale', 'guideVersion'])
        url.searchParams.set(key, request[key]);
      for (const key of ['cursor', 'limit', 'section'])
        if (request[key] !== null && request[key] !== undefined) url.searchParams.set(key, request[key]);
      const response = await fetch(url, { method: 'GET', mode: 'cors', credentials: 'omit',
        referrerPolicy: 'no-referrer' });
      if (!response.ok) throw Error('DISCUSSION_READ_FAILED');
      return response.json();
    },
    async readSummary(request) {
      const url = new URL(endpoint + '/summary');
      for (const key of ['guideVersion', 'scope', 'locale', 'cursor', 'limit'])
        if (request[key] !== null && request[key] !== undefined && request[key] !== '') url.searchParams.set(key, request[key]);
      const response = await fetch(url, { method: 'GET', mode: 'cors', credentials: 'omit', referrerPolicy: 'no-referrer' });
      if (!response.ok) throw Error('DISCUSSION_READ_FAILED');
      return response.json();
    },
    async readReactions(input) {
      const payload = reactionContext(input);
      if (!Array.isArray(input.commentIds) || !input.commentIds.length || input.commentIds.length > 50 ||
          !input.commentIds.every(uuid) || new Set(input.commentIds).size !== input.commentIds.length)
        throw Error('INVALID_REACTION_REQUEST');
      payload.commentIds = [...input.commentIds];
      if (input.visitorId !== undefined) payload.visitorId = input.visitorId;
      const data = await reactionRequest('/reactions/read', payload);
      if (!Array.isArray(data.reactions) || data.reactions.length !== payload.commentIds.length ||
          new Set(data.reactions.map(row => row?.commentId)).size !== data.reactions.length ||
          !data.reactions.every(row => payload.commentIds.includes(row?.commentId) && validReaction(row, row.commentId)))
        throw Error('INVALID_REACTION_RESPONSE');
      return { ok: true, reactions: data.reactions.map(row => ({ commentId: row.commentId,
        counts: { ...row.counts }, selected: [...row.selected], canReact: row.canReact })) };
    },
    async setReaction(input) {
      const payload = reactionContext(input);
      if (!uuid(input.commentId) || !reactionTypes.includes(input.type) || !['add', 'remove'].includes(input.intent) ||
          !/^[0-9a-f]{64}$/.test(input.visitorId)) throw Error('INVALID_REACTION_REQUEST');
      Object.assign(payload, { commentId: input.commentId, type: input.type, visitorId: input.visitorId, intent: input.intent });
      const data = await reactionRequest('/reactions', payload, true);
      if (!validReaction(data.reaction, input.commentId)) {
        const error = Error('INVALID_REACTION_RESPONSE'); error.outcomeUnknown = true; throw error;
      }
      const row = data.reaction;
      return { ok: true, reaction: { commentId: row.commentId, counts: { ...row.counts }, selected: [...row.selected], canReact: row.canReact } };
    },
    async postComment(input) {
      const payload = {
        schemaVersion: 1, pageKey: input.pageKey, locale: input.locale,
        guideVersion: input.guideVersion, displayName: input.displayName, body: input.body,
        pageHash: input.pageHash, parentCommentId: input.parentCommentId,
        replyToCommentId: input.replyToCommentId ?? null,
        turnstileToken: input.turnstileToken, honeypot: input.honeypot,
      };
      let response;
      try { response = await fetch(endpoint + '/comments', {
        method: 'POST', mode: 'cors', credentials: 'omit', referrerPolicy: 'no-referrer',
        headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload),
      }); } catch (cause) {
        const error = Error('DISCUSSION_POST_UNKNOWN', { cause });
        error.outcomeUnknown = true;
        throw error;
      }
      let data = null;
      try { data = await response.json(); } catch { /* HTTP status remains authoritative. */ }
      if (response.status === 201) return {
        ok: true, httpStatus: 201, commentId: typeof data?.commentId === 'string' ? data.commentId : null,
      };
      const error = Error('DISCUSSION_POST_FAILED');
      error.outcomeUnknown = ![400, 401, 403, 404, 405, 409, 413, 415, 422, 423, 429].includes(response.status);
      error.code = typeof data?.code === 'string' ? data.code : null;
      error.fieldErrors = data?.fieldErrors && typeof data.fieldErrors === 'object' ? data.fieldErrors : null;
      throw error;
    },
    async sendFeedback(input) {
      const payload = {
        schemaVersion: 1, category: input.category, message: input.message,
        contact: input.contact, guideVersion: input.guideVersion, locale: input.locale,
        pagePath: input.pagePath, pageHash: input.pageHash,
        viewportClass: input.viewportClass, relatedCommentId: input.relatedCommentId,
        turnstileToken: input.turnstileToken, honeypot: input.honeypot,
      };
      const response = await fetch(config.origin + '/v1/feedback', {
        method: 'POST', mode: 'cors', credentials: 'omit', referrerPolicy: 'no-referrer',
        headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload),
      });
      let data = null;
      try { data = await response.json(); } catch { /* HTTP status remains authoritative. */ }
      if (response.status === 202) return { ok: true, httpStatus: 202 };
      const error = Error('FEEDBACK_SEND_FAILED');
      error.code = typeof data?.code === 'string' ? data.code : null;
      error.fieldErrors = data?.fieldErrors && typeof data.fieldErrors === 'object' ? data.fieldErrors : null;
      throw error;
    },
  });
})();
</script>
