<script>
(() => {
  const start = () => {
    const body = document.body;
    if (body.classList.contains('dw-layout-ready')) return;
    const english = document.documentElement.lang.startsWith('en');
    const navbar = document.querySelector('.navbar .container-fluid');
    const theme = document.querySelector('.quarto-color-scheme-toggle');
    const nativeSearch = document.querySelector('#quarto-search');
    if (navbar && theme && nativeSearch) {
      let tools = navbar.querySelector('.quarto-navbar-tools');
      if (!tools) { tools = document.createElement('div'); tools.className = 'quarto-navbar-tools'; navbar.append(tools); }
      tools.append(theme);
      const auto = document.createElement('button');
      auto.type = 'button'; auto.className = 'dw-theme-auto'; auto.textContent = english ? 'Auto' : '自动';
      auto.title = english ? 'Follow system appearance' : '跟随系统外观'; auto.setAttribute('aria-label', auto.title);
      const syncTheme = () => {
        const label = english ? (body.classList.contains('quarto-dark') ? 'Switch to light mode' : 'Switch to dark mode') : (body.classList.contains('quarto-dark') ? '切换至浅色模式' : '切换至深色模式');
        theme.title = label; theme.setAttribute('aria-label', label);
        try { auto.setAttribute('aria-pressed', String(localStorage.getItem('quarto-color-scheme') === null)); } catch {}
      };
      auto.addEventListener('click', () => { try { localStorage.removeItem('quarto-color-scheme'); location.reload(); } catch {} });
      tools.append(auto); syncTheme();
      new MutationObserver(syncTheme).observe(body, {attributes:true, attributeFilter:['class']});
      const language = [...navbar.querySelectorAll('a')].find(a => a.textContent.trim() === (english ? '中文' : 'EN'));
      if (language) { language.classList.add('dw-language-switch'); tools.append(language); }
      let nativeSearchButton;
      const prepareNativeSearch = () => {
        nativeSearchButton = nativeSearch.querySelector('.aa-DetachedSearchButton');
        if (!nativeSearchButton) return false;
        nativeSearchButton.tabIndex = -1;
        nativeSearchButton.setAttribute('aria-hidden', 'true');
        return true;
      };
      if (!prepareNativeSearch()) requestAnimationFrame(prepareNativeSearch);
      const search = document.createElement('button'); search.type = 'button'; search.className = 'dw-search-launcher';
      search.title = english ? 'Search' : '搜索'; search.setAttribute('aria-label', search.title);
      search.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.75"/><path d="m16 16 4.25 4.25"/></svg>';
      let restoreSearchFocus = false;
      const restoreSearchLauncher = () => requestAnimationFrame(() => {
        if (restoreSearchFocus && !document.querySelector('.aa-DetachedContainer')) {
          restoreSearchFocus = false;
          search.focus();
        }
      });
      search.addEventListener('click', () => {
        if (!nativeSearchButton?.isConnected) prepareNativeSearch();
        restoreSearchFocus = true;
        nativeSearchButton?.click();
      });
      document.addEventListener('keydown', event => { if (event.key === 'Escape') restoreSearchLauncher(); });
      document.addEventListener('click', event => {
        if (event.target.closest?.('.aa-DetachedCancelButton')) restoreSearchLauncher();
      });
      tools.append(search); body.classList.add('dw-tools-ready');
    }
    // A shared sidebar spans every section; highlight the actual navbar destination.
    const currentPath = location.pathname.replace(/index\.html$/, '');
    document.querySelectorAll('#navbarCollapse .nav-link').forEach(link => {
      const menu = link.closest('.nav-item')?.querySelector('.dropdown-menu');
      const matches = [...(menu ? menu.querySelectorAll('a[href]') : [link])].some(a => new URL(a.href).pathname.replace(/index\.html$/, '') === currentPath);
      link.classList.toggle('active', matches);
      if (matches) link.setAttribute('aria-current', 'page'); else link.removeAttribute('aria-current');
    });
    document.querySelectorAll('main.content table').forEach(table => {
      if (table.closest('.table-responsive, .quarto-bootstrap-table, .dw-table-scroll, .dw-memorium-locator')) return;
      const scroll = document.createElement('div'); scroll.className = 'dw-table-scroll';
      table.before(scroll); scroll.append(table);
    });
    const desktop = matchMedia('(min-width: 1100px)');
    const tablet = matchMedia('(min-width: 768px)');
    const mobile = matchMedia('(max-width: 767.98px)');
    const read = key => { try { return localStorage.getItem(key) === '1'; } catch { return false; } };
    const write = (key, value) => { try { localStorage.setItem(key, value ? '1' : '0'); } catch {} };
    const panels = [];
    for (const side of ['left', 'right']) {
      const panel = document.getElementById(side === 'left' ? 'quarto-sidebar' : 'quarto-margin-sidebar');
      const hasContent = panel && (side === 'left' || panel.querySelector('#TOC'));
      if (!hasContent) { body.classList.add('dw-no-' + side); continue; }
      const title = side === 'left' ? (english ? 'Navigation' : '导航') : (english ? 'On this page' : '本页目录');
      const key = 'dw-guide-' + side + '-collapsed';
      const media = side === 'left' ? desktop : tablet;
      let collapsed = read(key);
      const toolbar = document.createElement('div');
      toolbar.className = 'dw-panel-toolbar';
      const label = document.createElement('span'); label.textContent = title; toolbar.append(label);
      const button = (open) => {
        const b = document.createElement('button'); b.type = 'button';
        b.className = open ? 'dw-edge-toggle dw-edge-' + side : 'dw-panel-toggle';
        b.textContent = (side === 'left') === open ? '→' : '←';
        b.title = english ? (open ? 'Expand ' : 'Collapse ') + (side === 'left' ? 'navigation' : 'table of contents') : (open ? '展开' : '收起') + (side === 'left' ? '左侧导航' : '本页目录');
        b.setAttribute('aria-label', b.title); b.setAttribute('aria-controls', panel.id);
        return b;
      };
      const closeButton = button(false), openButton = button(true);
      toolbar.append(closeButton);panel.prepend(toolbar);body.append(openButton);
      const apply = () => {
        const hidden = media.matches && collapsed;
        body.classList.toggle('dw-' + side + '-collapsed', hidden);
        panel.inert = hidden;
        if (hidden) panel.setAttribute('aria-hidden','true'); else panel.removeAttribute('aria-hidden');
        closeButton.setAttribute('aria-expanded', String(!hidden));
        openButton.setAttribute('aria-expanded', String(!hidden));
        openButton.hidden = !hidden;
      };
      closeButton.addEventListener('click', () => { collapsed = true;write(key,collapsed);apply();openButton.focus(); });
      openButton.addEventListener('click', () => { collapsed = false;write(key,collapsed);apply();closeButton.focus(); });
      media.addEventListener('change', apply);
      panels.push(apply);
    }
    let applyMobileToc;
    const marginSidebar = document.getElementById('quarto-margin-sidebar');
    const toc = marginSidebar?.querySelector('#TOC');
    const tocLinks = [...(toc?.querySelectorAll('a[data-scroll-target^="#"]') || [])];
    const secondaryNav = document.querySelector('.quarto-secondary-nav > .container-fluid');
    if (marginSidebar && tocLinks.length && secondaryNav) {
      const title = english ? 'On this page' : '本页目录';
      const toggle = document.createElement('button');
      toggle.type = 'button'; toggle.className = 'dw-mobile-toc-toggle'; toggle.hidden = true;
      toggle.title = title; toggle.setAttribute('aria-label', title);
      toggle.setAttribute('aria-controls', marginSidebar.id); toggle.setAttribute('aria-expanded', 'false');
      toggle.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".8" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r=".8" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r=".8" fill="currentColor" stroke="none"/></svg>';
      secondaryNav.append(toggle);
      const toolbar = marginSidebar.querySelector('.dw-panel-toolbar');
      const close = document.createElement('button');
      close.type = 'button'; close.className = 'dw-mobile-toc-close';
      close.title = english ? 'Close table of contents' : '关闭本页目录';
      close.setAttribute('aria-label', close.title); close.setAttribute('aria-controls', marginSidebar.id);
      close.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>';
      toolbar?.append(close);
      const backdrop = document.createElement('div');
      backdrop.className = 'dw-mobile-toc-backdrop'; backdrop.hidden = true; backdrop.setAttribute('aria-hidden', 'true');
      body.append(backdrop); body.classList.add('dw-mobile-toc-enabled');
      let open = false;
      const restoreToggleFocus = () => requestAnimationFrame(() => toggle.focus({preventScroll:true}));
      applyMobileToc = () => {
        if (!mobile.matches) {
          open = false; toggle.hidden = true; backdrop.hidden = true;
          body.classList.remove('dw-mobile-toc-open');
          marginSidebar.removeAttribute('role'); marginSidebar.removeAttribute('aria-modal'); marginSidebar.removeAttribute('aria-label');
          return;
        }
        toggle.hidden = false; toggle.setAttribute('aria-expanded', String(open)); backdrop.hidden = !open;
        body.classList.toggle('dw-mobile-toc-open', open);
        marginSidebar.inert = !open;
        if (open) {
          marginSidebar.removeAttribute('aria-hidden');
          marginSidebar.setAttribute('role', 'dialog'); marginSidebar.setAttribute('aria-modal', 'true'); marginSidebar.setAttribute('aria-label', title);
        } else {
          marginSidebar.setAttribute('aria-hidden', 'true');
          marginSidebar.removeAttribute('role'); marginSidebar.removeAttribute('aria-modal'); marginSidebar.removeAttribute('aria-label');
        }
      };
      const openToc = () => {
        if (!mobile.matches || open) return;
        open = true; applyMobileToc(); requestAnimationFrame(() => (close.offsetParent ? close : tocLinks[0]).focus());
      };
      const closeToc = (restoreFocus = true) => {
        if (!open) return;
        open = false; applyMobileToc(); if (restoreFocus) restoreToggleFocus();
      };
      toggle.addEventListener('click', () => open ? closeToc() : openToc());
      close.addEventListener('click', () => closeToc());
      backdrop.addEventListener('click', () => closeToc());
      toc.addEventListener('click', event => {
        const link = event.target.closest('a[data-scroll-target^="#"]');
        if (!link || !open) return;
        closeToc(false);
        // Keyboard activation leaves the now-inert drawer; continue at its destination.
        if (event.detail === 0) requestAnimationFrame(() => {
          let id;
          try { id = decodeURIComponent(link.hash.slice(1)); }
          catch { return; }
          const target = document.getElementById(id);
          const heading = target?.querySelector(':scope > h1, :scope > h2, :scope > h3, :scope > h4') || target;
          if (!heading) return;
          if (!heading.hasAttribute('tabindex')) {
            heading.tabIndex = -1;
            heading.addEventListener('blur', () => heading.removeAttribute('tabindex'), {once: true});
          }
          heading.focus({preventScroll: true});
        });
      });
      document.addEventListener('keydown', event => {
        if (!open || !mobile.matches) return;
        if (event.key === 'Escape') { event.preventDefault(); closeToc(); return; }
        if (event.key !== 'Tab') return;
        const focusable = [close, ...tocLinks].filter(element => element.offsetParent !== null);
        if (!focusable.length) return;
        const first = focusable[0], last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      });
      mobile.addEventListener('change', () => requestAnimationFrame(() => { panels.forEach(apply => apply()); applyMobileToc(); }));
    }
    const header = document.getElementById('quarto-header');
    const measure = () => document.documentElement.style.setProperty('--dw-header-height', (header?.getBoundingClientRect().height || 64) + 'px');
    measure();
    if (header) new ResizeObserver(measure).observe(header);
    body.classList.add('dw-layout-ready');
    panels.forEach(apply => apply());
    applyMobileToc?.();
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
